name: Public core checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      # actions/checkout v7.0.1; verified in the upstream actions/checkout repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-python v7.0.0; verified in the upstream actions/setup-python repository.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: false

      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v

      - name: Run minimal example
        run: python -m examples.minimal

      - name: Compile source, examples, and tests
        run: python -m compileall -q fioos_core examples tests
